[project]
name = "aftersales-copilot"
version = "1.0.0"
description = "A local LangGraph after-sales workflow agent"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "conftest"]
